name: Follow app releases

# Points the chart at a new Domestique release, so a `v*` tag in
# wncservices/domestique reaches Kargo (whose Warehouse watches this Helm
# repository, not the image) without a hand-written bump. It makes exactly the
# change the manual "Release app X (chart Y)" commits made: `appVersion` to the
# new release, chart `version` up one patch.
#
# Started by the app repo's image workflow once the release image is pushed
# (wncservices/domestique `.github/workflows/image.yml`, job `chart`), using the
# `wncservices-dispatch` GitHub App: Actions write on this repo only. So the app
# repo can ask for this run but cannot push here; the commit below is made with
# this repo's own GITHUB_TOKEN. Run it by hand the same way to re-try:
#   gh workflow run app-release.yml -f version=v2.17.4
#
# The version comes in as an input rather than from the app's "latest release":
# the app's GitHub Release is created by a separate workflow in parallel, so at
# dispatch time it may not exist yet.
on:
  workflow_dispatch:
    inputs:
      version:
        description: App release tag, e.g. v2.17.4
        required: true
        type: string

permissions: {}

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump to app ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      # Commits the bump to main.
      contents: write
      # Starts chart-release.yml. A push made with GITHUB_TOKEN triggers no
      # workflows, but a workflow_dispatch made with it does.
      actions: write
    env:
      CHART: charts/domestique/Chart.yaml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # The input is checked against a plain vX.Y.Z before it goes anywhere near
      # Chart.yaml, and the image it names must exist: the chart would deploy it.
      - name: Compare with the current appVersion
        id: check
        env:
          TAG: ${{ inputs.version }}
        run: |
          app="${TAG#v}"
          if ! [[ "$app" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$TAG' is not vX.Y.Z"; exit 1
          fi
          token=$(curl -sf "https://ghcr.io/token?scope=repository:wncservices/domestique:pull&service=ghcr.io" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/wncservices/domestique/manifests/${app}")
          if [ "$code" != "200" ]; then
            echo "::error::ghcr.io/wncservices/domestique:${app} not found (HTTP ${code})"; exit 1
          fi
          current=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' "$CHART")
          chart=$(sed -n 's/^version: *\([0-9.]*\) *$/\1/p' "$CHART")
          if ! [[ "$chart" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not read the chart version from $CHART"; exit 1
          fi
          # Only move forward: an older (or the same) release is left alone, so
          # a hand bump or a re-run is never undone.
          newest=$(printf '%s\n%s\n' "$current" "$app" | sort -V | tail -n1)
          if [ "$app" = "$current" ] || [ "$newest" != "$app" ]; then
            echo "appVersion $current is already at or past $TAG"
            exit 0
          fi
          next="${chart%.*}.$(( ${chart##*.} + 1 ))"
          echo "app $current -> $app, chart $chart -> $next"
          {
            echo "app=$app"
            echo "chart=$next"
          } >> "$GITHUB_OUTPUT"

      - name: Bump Chart.yaml
        if: steps.check.outputs.app
        env:
          APP: ${{ steps.check.outputs.app }}
          NEXT: ${{ steps.check.outputs.chart }}
        run: |
          sed -i -e "s/^version: .*/version: ${NEXT}/" \
                 -e "s/^appVersion: .*/appVersion: \"${APP}\"/" "$CHART"
          git diff --exit-code --quiet "$CHART" && { echo "::error::nothing changed"; exit 1; }
          git diff "$CHART"

      # ci.yml does not run on this push (GITHUB_TOKEN), so check here that the
      # chart still lints and renders. Only two version strings changed.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        if: steps.check.outputs.app
      - name: Lint and render
        if: steps.check.outputs.app
        run: |
          helm lint charts/domestique
          for values in charts/domestique/ci/*-values.yaml; do
            helm template dom charts/domestique -f "$values" > /dev/null
          done

      - name: Commit and publish
        if: steps.check.outputs.app
        env:
          APP: ${{ steps.check.outputs.app }}
          NEXT: ${{ steps.check.outputs.chart }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release app ${APP} (chart ${NEXT})" -- "$CHART"
          git push origin HEAD:main
          gh workflow run chart-release.yml --ref main
