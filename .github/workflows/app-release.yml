name: Follow app releases

# Points the chart at each new Domestique release, so a `v*` tag in
# wncservices/domestique reaches Kargo (whose Warehouse watches this Helm
# repository, not the image) without a hand-written bump. It makes exactly the
# change the manual "Release app X (chart Y)" commits made: `appVersion` to the
# new release, chart `version` up one patch.
#
# Pull, not push: the app repo is public, so reading its latest release needs no
# credential, and nothing outside this repo ever holds write access to it.
#
# `main` is protected (pull request, one approval, the "Helm chart" check), and
# GITHUB_TOKEN can't bypass that. So this opens the bump as a pull request on
# `release/app-<version>` and starts ci.yml on it; merging it is a person's
# click, and that push to main is what runs chart-release.yml. Needs "Allow
# GitHub Actions to create and approve pull requests" (repo and organisation).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump to the latest app release
    runs-on: ubuntu-latest
    permissions:
      # Pushes the release/app-<version> branch.
      contents: write
      # Opens the pull request.
      pull-requests: write
      # Starts ci.yml on that branch. A pull request opened with GITHUB_TOKEN
      # triggers no workflows, so the required "Helm chart" check would never
      # run on it; a workflow_dispatch made with it does.
      actions: write
    env:
      CHART: charts/domestique/Chart.yaml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # `releases/latest` skips drafts and pre-releases. The tag is checked
      # against a plain x.y.z before it goes anywhere near Chart.yaml.
      - name: Compare with the latest app release
        id: check
        run: |
          tag=$(gh api repos/wncservices/domestique/releases/latest --jq .tag_name)
          app="${tag#v}"
          if ! [[ "$app" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::latest release tag '$tag' is not vX.Y.Z"; exit 1
          fi
          # The release and its image are built by two parallel workflows in the
          # app repo. Until the image is in GHCR the chart can't deploy it, so
          # leave it for the next run rather than fail.
          token=$(curl -sf "https://ghcr.io/token?scope=repository:wncservices/domestique:pull&service=ghcr.io" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/wncservices/domestique/manifests/${app}")
          if [ "$code" != "200" ]; then
            echo "::notice::ghcr.io/wncservices/domestique:${app} not pushed yet (HTTP ${code}); next run"
            exit 0
          fi
          # A bump already waiting for review (opened here or by hand, same
          # branch name) is left alone.
          open=$(gh pr list --head "release/app-${app}" --state open --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "::notice::a pull request for release/app-${app} is already open"
            exit 0
          fi
          current=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' "$CHART")
          chart=$(sed -n 's/^version: *\([0-9.]*\) *$/\1/p' "$CHART")
          if ! [[ "$chart" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not read the chart version from $CHART"; exit 1
          fi
          # Only move forward: a release older than (or equal to) appVersion is
          # left alone, so a hand bump or a re-run is never undone.
          newest=$(printf '%s\n%s\n' "$current" "$app" | sort -V | tail -n1)
          if [ "$app" = "$current" ] || [ "$newest" != "$app" ]; then
            echo "appVersion $current is current (latest release $tag)"
            exit 0
          fi
          next="${chart%.*}.$(( ${chart##*.} + 1 ))"
          echo "app $current -> $app, chart $chart -> $next"
          {
            echo "app=$app"
            echo "chart=$next"
          } >> "$GITHUB_OUTPUT"

      - name: Bump Chart.yaml
        if: steps.check.outputs.app
        env:
          APP: ${{ steps.check.outputs.app }}
          NEXT: ${{ steps.check.outputs.chart }}
        run: |
          sed -i -e "s/^version: .*/version: ${NEXT}/" \
                 -e "s/^appVersion: .*/appVersion: \"${APP}\"/" "$CHART"
          git diff --exit-code --quiet "$CHART" && { echo "::error::nothing changed"; exit 1; }
          git diff "$CHART"

      # Fail here rather than open a pull request that can't pass. ci.yml then
      # runs the full check (including the app's own config validation) on it.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        if: steps.check.outputs.app
      - name: Lint and render
        if: steps.check.outputs.app
        run: |
          helm lint charts/domestique
          for values in charts/domestique/ci/*-values.yaml; do
            helm template dom charts/domestique -f "$values" > /dev/null
          done

      - name: Open the pull request
        if: steps.check.outputs.app
        env:
          APP: ${{ steps.check.outputs.app }}
          NEXT: ${{ steps.check.outputs.chart }}
        run: |
          branch="release/app-${APP}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Release app ${APP} (chart ${NEXT})" -- "$CHART"
          # Force: a leftover branch from a closed pull request is ours to replace.
          git push --force origin "HEAD:refs/heads/${branch}"
          gh pr create --base main --head "$branch" \
            --title "Release app ${APP} (chart ${NEXT})" \
            --body "Points the chart at Domestique [v${APP}](https://github.com/wncservices/domestique/releases/tag/v${APP}). Opened by \`app-release.yml\`; merging it publishes chart ${NEXT}, which Kargo deploys to dev."
          gh workflow run ci.yml --ref "$branch"
