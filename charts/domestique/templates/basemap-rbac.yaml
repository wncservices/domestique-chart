{{- if .Values.basemapUpdate.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "domestique.fullname" . }}-basemap-trigger
  namespace: {{ .Values.basemapUpdate.tilesNamespace }}
  labels:
    {{- include "domestique.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "domestique.fullname" . }}-basemap-trigger
  namespace: {{ .Values.basemapUpdate.tilesNamespace }}
  labels:
    {{- include "domestique.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "domestique.fullname" . }}-basemap-trigger
subjects:
  - kind: ServiceAccount
    name: {{ include "domestique.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
