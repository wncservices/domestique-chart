{{- if .Values.basemapUpdate.enabled -}}
# One identity, not two: the Job's own copy container used to need a
# second, narrowly-scoped ServiceAccount (create pods/exec, get/list
# pods) purely so `kubectl cp`/`kubectl exec` could place the extracted
# file into the running tiles pod. That transfer now happens by mounting
# the tiles PVC directly (basemapUpdate.tilesPVCName, an nfs-client/
# ReadWriteMany volume both the Job and the tiles pod hold at once) —
# neither the extract nor the copy container calls the Kubernetes API at
# all anymore, so there is nothing left for a second identity to scope.
#
# This app's own ServiceAccount (already exists, serviceaccount.yaml,
# already mounted per automountServiceAccountToken: true) may
# create/get/list/watch Jobs and get/list Pods and read Pod logs in the
# tiles namespace, so it can start a basemap update and poll its own
# progress. No delete: a triggered Job sets its own
# ttlSecondsAfterFinished, so cleanup is the Kubernetes TTL controller's
# job, not this app's — nothing here ever needs to delete a Job itself,
# so it does not hold the permission to. Nothing else either: it cannot
# touch a Secret, exec into anything, or read/write any other resource
# type there, and it has no access outside the tiles namespace at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "domestique.fullname" . }}-basemap-trigger
  namespace: {{ .Values.basemapUpdate.tilesNamespace }}
  labels:
    {{- include "domestique.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "domestique.fullname" . }}-basemap-trigger
  namespace: {{ .Values.basemapUpdate.tilesNamespace }}
  labels:
    {{- include "domestique.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "domestique.fullname" . }}-basemap-trigger
subjects:
  - kind: ServiceAccount
    name: {{ include "domestique.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
