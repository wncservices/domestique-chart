apiVersion: v1
kind: Service
metadata:
  name: {{ include "domestique.fullname" . }}
  labels:
    {{- include "domestique.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "domestique.selectorLabels" . | nindent 4 }}
{{- if .Values.rollout.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "domestique.fullname" . }}-preview
  labels:
    {{- include "domestique.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "domestique.selectorLabels" . | nindent 4 }}
{{- end }}
