{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
# Scrapes the metrics port on the main Service only: the Argo Rollouts preview
# Service carries no metrics port, so it yields no targets.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "domestique.fullname" . }}
  labels:
    {{- include "domestique.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "domestique.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
