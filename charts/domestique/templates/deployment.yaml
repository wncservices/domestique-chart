{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "domestique.fullname" . }}
  labels:
    {{- include "domestique.labels" . | nindent 4 }}
  {{- if .Values.rollout.enabled }}
  annotations:
    notifications.argoproj.io/subscribe.on-rollout-completed.github: ""
    notifications.argoproj.io/subscribe.on-rollout-aborted.github: ""
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if .Values.rollout.enabled }}
  {{- if or (ne .Values.rollout.analysis.successfulRunHistoryLimit nil) (ne .Values.rollout.analysis.unsuccessfulRunHistoryLimit nil) }}
  analysis:
    {{- if ne .Values.rollout.analysis.successfulRunHistoryLimit nil }}
    successfulRunHistoryLimit: {{ .Values.rollout.analysis.successfulRunHistoryLimit }}
    {{- end }}
    {{- if ne .Values.rollout.analysis.unsuccessfulRunHistoryLimit nil }}
    unsuccessfulRunHistoryLimit: {{ .Values.rollout.analysis.unsuccessfulRunHistoryLimit }}
    {{- end }}
  {{- end }}
  strategy:
    blueGreen:
      activeService: {{ include "domestique.fullname" . }}
      previewService: {{ include "domestique.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.rollout.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.rollout.blueGreen.scaleDownDelaySeconds }}
      {{- with .Values.rollout.blueGreen.prePromotionAnalysis.templates }}
      prePromotionAnalysis:
        templates:
          {{- toYaml . | nindent 10 }}
        {{- with $.Values.rollout.blueGreen.prePromotionAnalysis.args }}
        args:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .Values.rollout.blueGreen.postPromotionAnalysis.templates }}
      postPromotionAnalysis:
        templates:
          {{- toYaml . | nindent 10 }}
        {{- with $.Values.rollout.blueGreen.postPromotionAnalysis.args }}
        args:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
  {{- else }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "domestique.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- $names := list (include "domestique.databaseSecret" .) }}
        {{- with .Values.encryptionKey.existingSecret }}
        {{- $names = append $names . }}
        {{- end }}
        {{- range .Values.env }}
        {{- with .valueFrom }}{{ with .secretKeyRef }}{{ $names = append $names .name }}{{ end }}{{ end }}
        {{- end }}
        {{- range .Values.envFrom }}
        {{- with .secretRef }}{{ $names = append $names .name }}{{ end }}
        {{- end }}
        {{- range $names | uniq }}
        checksum/secret-{{ . }}: {{ (lookup "v1" "Secret" $.Release.Namespace .).data | toJson | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "domestique.selectorLabels" . | nindent 8 }}
        {{- with .Values.image.gitSha }}
        domestique.dev/git-sha: {{ . | quote }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "domestique.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: domestique
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - serve
            - --addr=:8080
            - --config=/app/domestique.yaml
            - --web-dir=/app/web
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DOMESTIQUE_METRICS_ADDR
              value: {{ if .Values.metrics.enabled }}{{ printf ":%v" .Values.metrics.port | quote }}{{ else }}""{{ end }}
            - name: DOMESTIQUE_SOURCE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "domestique.databaseSecret" . }}
                  key: {{ include "domestique.databaseSecretKey" . }}
            {{- with .Values.encryptionKey.existingSecret }}
            - name: DOMESTIQUE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.encryptionKey.secretKey }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/domestique.yaml
              subPath: domestique.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "domestique.fullname" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
