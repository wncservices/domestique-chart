{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "domestique.fullname" . }}
  labels:
    {{- include "domestique.labels" . | nindent 4 }}
  {{- if .Values.rollout.enabled }}
  # Argo Rollouts' own notification-engine, not application config this
  # chart otherwise renders — see rollout.blueGreen's own comment in
  # values.yaml for why this needs a cluster with the Argo Rollouts
  # controller and its notification config already in place.
  annotations:
    notifications.argoproj.io/subscribe.on-rollout-completed.github: ""
    notifications.argoproj.io/subscribe.on-rollout-aborted.github: ""
  {{- end }}
spec:
  # One replica on purpose. Two would race on the state file and on the remote
  # ids it records; see values.yaml. (Blue-green's own brief dual-pod window
  # is a different, larger version of the same race, closed at the
  # application level instead — see the app's own backgroundSyncLockKey.)
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if .Values.rollout.enabled }}
  strategy:
    blueGreen:
      activeService: {{ include "domestique.fullname" . }}
      previewService: {{ include "domestique.fullname" . }}-preview
      # false: promotion waits for prePromotionAnalysis to actually pass,
      # not just for the preview pod to become Ready. Ready only means the
      # process started — it says nothing about whether this build works.
      autoPromotionEnabled: {{ .Values.rollout.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.rollout.blueGreen.scaleDownDelaySeconds }}
      {{- with .Values.rollout.blueGreen.prePromotionAnalysis.templates }}
      prePromotionAnalysis:
        templates:
          {{- toYaml . | nindent 10 }}
        {{- with $.Values.rollout.blueGreen.prePromotionAnalysis.args }}
        args:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .Values.rollout.blueGreen.postPromotionAnalysis.templates }}
      postPromotionAnalysis:
        templates:
          {{- toYaml . | nindent 10 }}
        {{- with $.Values.rollout.blueGreen.postPromotionAnalysis.args }}
        args:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
  {{- else }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "domestique.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart the pod when the config changes, so an edit to values takes
        # effect without anyone remembering to bounce it.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Restart the pod when a referenced Secret's *content* changes too —
        # every one of these is a Secret this chart does not own or render
        # (most commonly an ExternalSecret syncing from a vault), so there is
        # no template output to hash the way configmap.yaml's own is above.
        # `lookup` reads the live object instead: Helm re-evaluates this on
        # every render, which for ArgoCD means every reconciliation, not just
        # a values change — an out-of-band Secret update becomes a real
        # manifest diff, which is what makes ArgoCD's own drift detection
        # (and self-heal, where enabled) restart the pod at all.
        #
        # Collected rather than named individually, so a self-hoster's own
        # envFrom/env additions get covered automatically: the database
        # secret (whichever databaseSecret resolves to), the optional
        # encryption-key secret, and every secretKeyRef/secretRef named
        # anywhere in .Values.env/.Values.envFrom.
        #
        # `lookup` returns an empty object outside a real cluster (`helm
        # template`, this chart's own CI) — the checksum comes out stable and
        # harmless there, which is correct: there is no live drift to detect
        # off-cluster anyway.
        {{- $names := list (include "domestique.databaseSecret" .) }}
        {{- with .Values.encryptionKey.existingSecret }}
        {{- $names = append $names . }}
        {{- end }}
        {{- range .Values.env }}
        {{- with .valueFrom }}{{ with .secretKeyRef }}{{ $names = append $names .name }}{{ end }}{{ end }}
        {{- end }}
        {{- range .Values.envFrom }}
        {{- with .secretRef }}{{ $names = append $names .name }}{{ end }}
        {{- end }}
        {{- range $names | uniq }}
        checksum/secret-{{ . }}: {{ (lookup "v1" "Secret" $.Release.Namespace .).data | toJson | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "domestique.selectorLabels" . | nindent 8 }}
        {{- with .Values.image.gitSha }}
        # The commit the running image was built from — read back by the
        # Argo Rollouts notification templates (argo-rollouts/templates/
        # notification-configmap.yaml, lab) as the GitHub commit-status
        # target. Not the image tag: GitHub's statuses API takes a sha, and
        # a release tag is not one.
        domestique.dev/git-sha: {{ . | quote }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "domestique.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: domestique
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - serve
            - --addr=:8080
            - --config=/app/domestique.yaml
            - --web-dir=/app/web
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # The DSN is the one thing this chart insists on. Sourced from a
            # Secret rather than the ConfigMap because it carries a password.
            - name: DOMESTIQUE_SOURCE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "domestique.databaseSecret" . }}
                  key: {{ include "domestique.databaseSecretKey" . }}
            {{- with .Values.encryptionKey.existingSecret }}
            - name: DOMESTIQUE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.encryptionKey.secretKey }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/domestique.yaml
              subPath: domestique.yaml
              readOnly: true
            # The root filesystem is read-only, so give the process a writable
            # temp directory rather than making the whole thing writable.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "domestique.fullname" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
