# Default values for domestique.

image:
  repository: ghcr.io/wncservices/domestique
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  # The full commit SHA the image at `tag` was built from. Only meaningful
  # with rollout.enabled below — becomes a pod-template label
  # (domestique.dev/git-sha) the Argo Rollouts notification config reads
  # back as its GitHub commit-status target. Empty is fine otherwise; there
  # is nothing to report a status against without Rollouts in the picture.
  gitSha: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The app's own configuration, rendered into a ConfigMap and mounted at
# /app/domestique.yaml. Nothing secret belongs here — it is a ConfigMap, and
# readable by anyone with access to the namespace.
#
# Credentials come from `envFrom` and `env` below instead.
config:
  # No `source` here on purpose. The DSN carries a password, so it comes from
  # a Secret as DOMESTIQUE_SOURCE_DSN — see `postgresql` below — and this file
  # is a ConfigMap that anyone with namespace access can read.

  # Domestique authenticates nobody itself. Behind Traefik with an Authelia
  # forwardAuth middleware it reads the identity Authelia passes down.
  #
  # THIS DEFAULTS TO OFF, WHICH MEANS EVERY VISITOR IS AN ADMIN. Set mode to
  # proxy before exposing this to anything.
  auth:
    mode: none
    # mode: proxy
    # trusted_proxies:
    #   - 10.0.0.0/8
    # roles:
    #   admin: [route-admins]
    #   rider: [riders]
    #   viewer: [guests]
    # default_role: viewer

    # mode: oidc — the app verifies signed tokens itself against an issuer
    # (Auth0, Keycloak, Zitadel, ...) instead of trusting a proxy header, so
    # unlike mode: proxy this one is fine to expose directly to the public.
    # client_secret comes from DOMESTIQUE_OIDC_CLIENT_SECRET below, never
    # from here, and DOMESTIQUE_ENCRYPTION_KEY (see encryptionKey: below)
    # must be set — without it there is nowhere safe to hold the session or
    # the short-lived sign-in state and /sso/login refuses outright.
    # mode: oidc
    # oidc:
    #   issuer: https://your-tenant.example.com/
    #   client_id: domestique
    #   redirect_url: https://app.example.com/sso/callback
    #   scopes: [openid, profile, email]
    #   groups_claim: groups   # empty if your issuer sends no groups at all
    # roles:
    #   admin: [domestique-admins]
    #   rider: [cyclists]

  komoot:
    enabled: false

  # Head units are not configured here. Riders link their own Garmin or Wahoo
  # from the web UI and it is stored in the database, so there is no second
  # place where somebody's devices are written down.

# Secrets reach the pod as environment variables. Create the Secret separately
# — with an ExternalSecret from Vault, for instance — and name it here.
#
# Keys Domestique reads:
#   DOMESTIQUE_SOURCE_DSN      PostgreSQL connection string (overrides config.source.dsn)
#   DOMESTIQUE_ENCRYPTION_KEY  base64 of 32 bytes; lets riders sign in to Komoot
#                              and Garmin from the UI. `domestique keygen`.
#                              Without it that form is not offered, and replacing
#                              it invalidates every stored sign-in.
#   GARMIN_OAUTH_CONSUMER_KEY  the OAuth1 consumer Connect's own clients use.
#   GARMIN_OAUTH_CONSUMER_SECRET  Optional: an admin can paste the pair into
#                              Settings instead, which is stored encrypted and
#                              takes precedence. Supply them here to keep them
#                              in Vault rather than in the database.
#   KOMOOT_EMAIL               one shared Komoot account, as an alternative to
#   KOMOOT_PASSWORD            riders signing in themselves
#   DOMESTIQUE_OIDC_CLIENT_SECRET      mode: oidc only — the OIDC client's own secret
#   DOMESTIQUE_AUTH0_MGMT_CLIENT_ID    Optional, mode: oidc only — a separate,
#   DOMESTIQUE_AUTH0_MGMT_CLIENT_SECRET  narrowly-scoped Auth0 Management API
#                              M2M app. Without these the People page (invite,
#                              list, change roles) is unavailable rather than broken.
envFrom: []
# - secretRef:
#     name: domestique

# Individual environment variables, for anything not in a Secret.
env: []

# PostgreSQL. Required — the chart will not render without one.
#
# Routes, sync state, linked head units and Komoot sign-ins are all rows in
# one database, so the pod keeps nothing of its own. That is why there is no
# volume here any more: with PostgreSQL there was nothing left to put on it,
# and an empty PVC that silently did nothing was worse than none.
#
# SQLite still works for a laptop (`just up`, `domestique serve`). It is not
# offered as a deployment: one replica pinned to one node, holding the only
# copy of the library on a volume nothing backs up.
postgresql:
  # Name of a CloudNativePG Cluster in this namespace. The operator publishes
  # a Secret called <cluster>-app containing a ready-made connection string,
  # and this reads it — nothing to copy, and it follows a failover. Either
  # bring your own (leave `enabled: false`, point `cluster` at it) or have
  # this chart create it (`enabled: true`, see below) — either way the
  # lookup is the same, because CNPG names that Secret identically either way.
  cluster: ""

  # Or point at any Secret holding a PostgreSQL URL. Takes precedence over
  # `cluster` when both are set.
  existingSecret: ""
  secretKey: uri

  # Set true to have this chart create the CNPG Cluster named above, instead
  # of requiring one to already exist. Requires the CNPG operator already
  # installed in the target cluster — this does not install it, only creates
  # a Cluster custom resource the operator then reconciles. `cluster` is
  # still required when this is true: it becomes the created Cluster's name,
  # deliberately not implicit, so there is one field controlling both which
  # Cluster gets created and which Secret gets read.
  enabled: false
  instances: 1
  storage:
    size: 2Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""

# Encrypts Komoot sign-ins so riders can connect their own account from the
# UI. Without it that form is not offered — a session is stored encrypted or
# not at all — and everything else works as normal.
#
# `domestique keygen` prints one. Put it in a Secret; never in this file.
encryptionKey:
  existingSecret: ""
  secretKey: DOMESTIQUE_ENCRYPTION_KEY

# A scheduled `pg_dump` of whichever database `postgresql`/`envFrom` above
# point at — this app has never taken its own backups, on purpose (see the
# chart README), so this is an opt-in second system, not something the app
# relies on existing. Off by default.
#
# Pick exactly one destination:
backup:
  enabled: false
  schedule: "0 3 * * *"

  # postgres:<tag> supplies pg_dump. Newer than the target server is the
  # safe direction (pg_dump can read an older server; the reverse is not
  # guaranteed), so default to something reasonably current rather than
  # trying to match a version this chart cannot know.
  image:
    repository: postgres
    tag: 16-alpine

  destination:
    # A PVC to dump into. Same container does the dump and prunes anything
    # older than `retention` days — no second image needed for this path.
    pvc:
      claimName: ""

    # OR: an S3-compatible endpoint. A Secret with keys endpoint, bucket,
    # accessKeyId, secretAccessKey. Uploaded via a second, minio/mc
    # container reading the dump from a shared emptyDir — pg_dump and an
    # S3 client do not both live in one image, so this is two containers,
    # not two chart features. `retention` is not applied here: most
    # S3-compatible stores have their own bucket lifecycle rules for this,
    # better suited to pruning object storage than a CronJob re-listing a
    # bucket on every run.
    existingSecret: ""

  # Days of dumps to keep. Only applies to the pvc destination.
  retention: 7

service:
  type: ClusterIP
  port: 80

# A plain networking.k8s.io/v1 Ingress — deliberately the only ingress
# resource this chart offers, so it works with whatever controller a
# cluster already has rather than assuming one. Empty className/annotations
# by default for the same reason: a generic chart cannot guess at Traefik,
# nginx, or anything else.
#
# Traefik users: no separate CRD needed. Traefik is a supported controller
# for a standard Ingress via annotations —
#   traefik.ingress.kubernetes.io/router.tls: "true"
#   traefik.ingress.kubernetes.io/router.tls.certresolver: <your resolver>
#   traefik.ingress.kubernetes.io/router.middlewares: <ns>-<name>@kubernetescrd
# See charts/domestique/README.md and ci/full-values.yaml for a worked
# example.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: domestique.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []

# The ServiceAccount name matters beyond RBAC: Vault's Kubernetes auth binds a
# role to a named ServiceAccount in a namespace, so this is the identity the
# app authenticates to Vault with.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# One replica, deliberately. Two would race on the sync state and on the remote
# ids it records, and a route library is not a workload that needs scaling.
replicaCount: 1

# A new pod is ready before the old one goes away.
#
# `Recreate` stopped the old pod first, so every deploy had a gap where the
# app was simply gone — and with one replica that gap is the whole service.
# maxUnavailable 0 means the rollout may never drop below the desired count;
# maxSurge 1 gives it the one extra pod it needs to honour that.
#
# The cost, stated plainly: for a few seconds during a rollout there are two
# pods, and replicaCount is 1 precisely because two of these can race on the
# remote ids a push records. A push landing inside that window could reach a
# head unit twice. That is a narrow window against a gap on every single
# deploy, which is why it is worth taking — but it is a real trade, not a
# free win, and it is the reason to leave replicaCount at 1 outside rollouts.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Opt-in: renders a Rollout (Argo Rollouts CRD) instead of the plain
# Deployment above, so real traffic only ever moves to a new version once
# it has actually been checked, not just once its pod is Ready.
#
# Off by default deliberately — this needs the Argo Rollouts controller
# already installed in the target cluster (this chart does not install it,
# same relationship it already has with CNPG below), and self-hosters
# without it should get the plain Deployment they already had, not a
# resource kind their cluster cannot schedule at all.
#
# `strategy:` above still governs the plain-Deployment path; it is unused
# whenever this is enabled.
rollout:
  enabled: false
  blueGreen:
    # false: wait for prePromotionAnalysis to actually pass, not just for
    # the new pod to become Ready — Ready only means the process started.
    autoPromotionEnabled: false
    # How long the previous version stays fully running (not just
    # scaled-to-zero-pending) after promotion — the window a
    # postPromotionAnalysis failure can still automatically roll back
    # into. Comfortably longer than a real end-to-end login check needs,
    # short enough that "two live pods" (see the app's own
    # backgroundSyncLockKey, which is what actually makes that safe rather
    # than merely brief) doesn't linger forever.
    scaleDownDelaySeconds: 300
    # Each entry is {templateName: <AnalysisTemplate/ClusterAnalysisTemplate
    # name>}, exactly the Rollout API's own shape — this chart does not
    # define what the templates actually check, only whether/which ones
    # run. A deployment wiring this up (domestique-infra, not this chart)
    # owns writing the AnalysisTemplate resources themselves and listing
    # their names here.
    prePromotionAnalysis:
      templates: []
      # - templateName: domestique-pre-promotion
      args: []
    postPromotionAnalysis:
      templates: []
      # - templateName: domestique-post-promotion
      args: []

revisionHistoryLimit: 3

# maxUnavailable, not minAvailable: with one replica, `minAvailable: 1` blocks
# node drains forever because the node can never evict the only pod.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  # minAvailable: 1

# The app authenticates to Vault with this ServiceAccount's token, so it needs
# to be mounted. Turn off only if nothing in-cluster authenticates as the app.
automountServiceAccountToken: true

terminationGracePeriodSeconds: 30
priorityClassName: ""
topologySpreadConstraints: []

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

# The image runs as uid 10001 and writes only to the mounted volume.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
