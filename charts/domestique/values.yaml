image:
  repository: ghcr.io/wncservices/domestique
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  # Commit the image was built from; only used with rollout.enabled.
  gitSha: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Rendered into a ConfigMap at /app/domestique.yaml. No secrets here.
config:
  # mode: none makes every visitor an admin. Use proxy or oidc before exposing it.
  auth:
    mode: none
    # mode: proxy
    # trusted_proxies:
    #   - 10.0.0.0/8
    # roles:
    #   admin: [route-admins]
    #   rider: [riders]
    #   viewer: [guests]
    # default_role: viewer

    # mode: oidc  (needs DOMESTIQUE_OIDC_CLIENT_SECRET and encryptionKey)
    # oidc:
    #   issuer: https://your-tenant.example.com/
    #   client_id: domestique
    #   redirect_url: https://app.example.com/sso/callback
    #   scopes: [openid, profile, email]
    #   groups_claim: groups
    # roles:
    #   admin: [domestique-admins]
    #   rider: [cyclists]

  komoot:
    enabled: false

# Secrets as environment variables, e.g. an ExternalSecret. See the README for the keys.
envFrom: []
# - secretRef:
#     name: domestique

env: []

# Required: the chart will not render without a database.
postgresql:
  # A CloudNativePG Cluster in this namespace; its <cluster>-app Secret is read.
  cluster: ""
  # Or any Secret holding a PostgreSQL URL; wins over `cluster`.
  existingSecret: ""
  secretKey: uri
  # Create the CNPG Cluster named `cluster` (needs the CNPG operator).
  enabled: false
  instances: 1
  storage:
    size: 2Gi
    storageClass: ""

encryptionKey:
  existingSecret: ""
  secretKey: DOMESTIQUE_ENCRYPTION_KEY

# Scheduled pg_dump. Set exactly one destination.
backup:
  enabled: false
  schedule: "0 3 * * *"
  image:
    repository: postgres
    tag: 16-alpine
  destination:
    pvc:
      claimName: ""
    # Secret with endpoint, bucket, accessKeyId, secretAccessKey.
    existingSecret: ""
  # Days to keep; pvc destination only.
  retention: 7

service:
  type: ClusterIP
  port: 80

# Served on its own port, which the ingress never routes to.
metrics:
  enabled: true
  port: 9090
  # Needs the Prometheus Operator CRDs.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: domestique.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Argo Rollouts blue-green instead of a Deployment (needs the controller).
rollout:
  enabled: false
  analysis:
    successfulRunHistoryLimit: null
    unsuccessfulRunHistoryLimit: null
  blueGreen:
    # With no analysis templates, false means nothing ever promotes automatically.
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 300
    prePromotionAnalysis:
      templates: []
      # - templateName: domestique-pre-promotion
      args: []
    postPromotionAnalysis:
      templates: []
      # - templateName: domestique-post-promotion
      args: []

revisionHistoryLimit: 3

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

automountServiceAccountToken: true

terminationGracePeriodSeconds: 30
priorityClassName: ""
topologySpreadConstraints: []

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Lets an admin update the tiles basemap from the UI (needs the tiles component).
basemapUpdate:
  enabled: false
  tilesNamespace: tiles
  # The tiles Deployment's basemap PVC (ReadWriteMany).
  tilesPVCName: ""
  extractImage:
    repository: protomaps/go-pmtiles
    tag: v1.31.2
  copyImage:
    repository: alpine
    tag: "3.24.3"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  activeDeadlineSeconds: 1800
