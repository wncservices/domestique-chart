config:
  source: {}

  auth:
    mode: proxy
    trusted_proxies:
      - 10.0.0.0/8
    roles:
      admin:
        - route-admins
      rider:
        - riders
      viewer:
        - guests
    default_role: viewer

  komoot:
    enabled: true

envFrom:
  - secretRef:
      name: domestique

postgresql:
  cluster: domestique-db

encryptionKey:
  existingSecret: domestique

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: traefik-internal@kubernetescrd
  hosts:
    - host: domestique.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: domestique-tls
      hosts:
        - domestique.example.com

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
