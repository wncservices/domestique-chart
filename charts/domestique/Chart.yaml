# Split out of wncservices/domestique's own charts/domestique/ into this repo,
# so the chart releases independently of the application.
apiVersion: v2
name: domestique
description: Shared cycling route library that syncs to Garmin and Wahoo head units
type: application

# The chart version. Bumped on every chart change; chart-releaser publishes a
# release per version, so this must go up or the release is skipped.
#
# 0.9.0: optional rollout.analysis.{successful,unsuccessful}RunHistoryLimit
# set the Rollout's own AnalysisRun retention (both null by default, meaning
# the Argo Rollouts controller's own default of 5/5 — unchanged from 0.8.0
# unless a values file sets either). Backward compatible.
#
# 0.8.0: basemapUpdate.tilesPodSelector/workVolumeSize replaced by
# tilesPVCName, and copyImage's default moved from alpine/k8s to a plain
# alpine — the update Job's copy step now mounts the tiles PVC directly
# (nfs-client, ReadWriteMany) instead of kubectl cp/exec-ing the extracted
# file into the running tiles pod, which proved unreliable for a file this
# size. The Job-only "copy" ServiceAccount/Role/RoleBinding
# basemap-rbac.yaml used to render is gone with it — neither container
# calls the Kubernetes API anymore. Not backward compatible: a values file
# still setting tilesPodSelector/workVolumeSize now sets nothing, and
# tilesPVCName must be set (to the tiles component's actual PVC name) for
# basemapUpdate.enabled to do anything useful.
#
# 0.7.0: optional basemapUpdate.enabled renders RBAC letting this app's own
# ServiceAccount trigger a basemap update Job in the tiles namespace.
# Backward compatible — the default (false) renders nothing new.
#
# 0.6.0: optional rollout.enabled renders a Rollout (Argo Rollouts CRD)
# instead of the plain Deployment, for a test-gated blue-green promotion.
# Backward compatible — the default (false) renders exactly what 0.5.0 did.
version: 0.9.0

# The application version, which is also the default image tag.
appVersion: "0.1.0"

home: https://github.com/wncservices/domestique
sources:
  - https://github.com/wncservices/domestique
keywords:
  - cycling
  - gpx
  - garmin
  - wahoo
  - komoot
maintainers:
  - name: wncservices
    url: https://github.com/wncservices
