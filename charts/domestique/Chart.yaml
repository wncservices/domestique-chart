# Split out of wncservices/domestique's own charts/domestique/ into this repo,
# so the chart releases independently of the application.
apiVersion: v2
name: domestique
description: Shared cycling route library that syncs to Garmin and Wahoo head units
type: application

# The chart version. Bumped on every chart change; chart-releaser publishes a
# release per version, so this must go up or the release is skipped.
#
# 0.7.0: optional basemapUpdate.enabled renders RBAC letting this app's own
# ServiceAccount trigger a basemap update Job in the tiles namespace.
# Backward compatible — the default (false) renders nothing new.
#
# 0.6.0: optional rollout.enabled renders a Rollout (Argo Rollouts CRD)
# instead of the plain Deployment, for a test-gated blue-green promotion.
# Backward compatible — the default (false) renders exactly what 0.5.0 did.
version: 0.7.0

# The application version, which is also the default image tag.
appVersion: "0.1.0"

home: https://github.com/wncservices/domestique
sources:
  - https://github.com/wncservices/domestique
keywords:
  - cycling
  - gpx
  - garmin
  - wahoo
  - komoot
maintainers:
  - name: wncservices
    url: https://github.com/wncservices
